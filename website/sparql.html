  <style>
    :root{
      /* banner height scales with viewport; clamped for usability */
      --banner-h: clamp(120px, 20vw, 220px);
    }
    body { font-family: 'Roboto', sans-serif; color: #333; margin: 0; }

    /* original intro paragraph styling */
    #intro1 {
      font-family: sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    /* Wider container on large displays */
    @media (min-width:1200px){
      .container.container-wide{ max-width: 1320px; }
    }
    @media (min-width:1600px){
      .container.container-wide{ max-width: 1440px; }
    }

    /* Banner spacing */
    .banner-wrap{
      padding-top: 36px;    /* space from top of page */
      padding-bottom: 24px; /* space before navbar */
    }

    /* Two-image banner, same width as table (.container) */
    .banner-pair{
      display: flex;
      height: var(--banner-h);
      gap: 0;
    }
    .banner-pair a{
      flex: 1 1 50%;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;       /* vertical center */
      justify-content: center;   /* horizontal center */
      cursor: pointer;
    }
    /* Show full image, no cropping */
    .banner-pair a img{
      max-height: 100%;
      max-width: 100%;
      height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Phones: stack images */
    @media (max-width: 575.98px){
      .banner-pair{
        flex-direction: column;
        height: auto;
      }
      .banner-pair a{
        width: 100%;
        height: 140px; /* per-image panel height on phones */
      }
    }
  </style>
</head>

        <a href="https://makaao.inria.fr/tree.html"    class="btn btn-primary mr-2 mb-2">Autoantibody Tree</a>
        <a href="https://makaao.inria.fr/sparql.html"  class="btn btn-primary mr-2 mb-2">SPARQL</a>
        <a href="https://makaao.inria.fr/download.html" class="btn btn-primary mr-2 mb-2">Download</a>
        <a href="https://makaao.inria.fr/contact.html" class="btn btn-primary mr-2 mb-2">Contact</a>
        <a href="https://makaao.inria.fr/about.html"   class="btn btn-primary mr-2 mb-2">About</a>
      </div>
    </div>
  </header>

      Below is a link to our Virtuoso SPARQL endpoint, which you can use to interact with our knowledge graph manually, or programmatically:

        SPARQL Endpoint
