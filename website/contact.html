  <main class="container container-wide py-4">
    <p id="intro1">
      If you have changes to suggest, or simply want to discuss the MAKAAO project, you can fill the form below or directly email <a href="mailto:contact.makaao@inria.fr">contact.makaao@inria.fr</a>
    </p>

    <div class="row justify-content-center">
      <div class="col-12 col-md-6">
        <h2>Contact Form</h2>
        <form id="contactForm" action="send_email.php" method="post">
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              placeholder="Your name"
              required
            >
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            >
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input
              type="text"
              class="form-control"
              id="subject"
              name="subject"
              placeholder="Subject"
              required
            >
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              class="form-control"
              id="message"
              name="message"
              rows="5"
              placeholder="Your message..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
    </div>
  </main>
